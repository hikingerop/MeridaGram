name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Download Xray core
        run: sh Tools/fetch-xray.sh

      # Own Telegram API ID from my.telegram.org, kept in repository secrets TG_API_ID and TG_API_HASH.
      # Without them the build keeps the official Telegram ID, which Telegram may refuse to log in with.
      - name: Use own Telegram API ID
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID / TG_API_HASH secrets are not set, building with the official Telegram API ID"
            exit 0
          fi
          echo "$TG_API_ID" | grep -qE '^[0-9]+$' || { echo "::error::TG_API_ID must be a number"; exit 1; }
          echo "$TG_API_HASH" | grep -qE '^[0-9a-f]{32}$' || { echo "::error::TG_API_HASH must be 32 hex characters"; exit 1; }
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(public static int APP_ID = )[0-9]+;/\1$TG_API_ID;/; s/(public static String APP_HASH = )\"[0-9a-f]+\";/\1\"$TG_API_HASH\";/" "$F"
          grep -q "APP_ID = $TG_API_ID;" "$F" || { echo "::error::could not set APP_ID"; exit 1; }
          echo "Using own Telegram API ID"

      # Own signing key, kept in repository secrets MERIDA_KEYSTORE (base64 of the JKS file, alias
      # «meridagram») and MERIDA_KEYSTORE_PASSWORD. Without them the build is signed with the public key
      # from the Telegram sources, which anyone can use.
      - name: Use own signing key
        env:
          MERIDA_KEYSTORE: ${{ secrets.MERIDA_KEYSTORE }}
          MERIDA_KEYSTORE_PASSWORD: ${{ secrets.MERIDA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$MERIDA_KEYSTORE" ] || [ -z "$MERIDA_KEYSTORE_PASSWORD" ]; then
            echo "::warning::MERIDA_KEYSTORE secrets are not set, signing with the public key from the sources"
            exit 0
          fi
          echo "$MERIDA_KEYSTORE_PASSWORD" | grep -qE '^[A-Za-z0-9]+$' || { echo "::error::MERIDA_KEYSTORE_PASSWORD must be letters and digits only"; exit 1; }
          echo "$MERIDA_KEYSTORE" | tr -d ' \r\n' | base64 -d > TMessagesProj/config/release.keystore
          keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$MERIDA_KEYSTORE_PASSWORD" -alias meridagram > /dev/null \
            || { echo "::error::MERIDA_KEYSTORE does not open with MERIDA_KEYSTORE_PASSWORD"; exit 1; }
          sed -i -E "s/^RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=$MERIDA_KEYSTORE_PASSWORD/; s/^RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=meridagram/; s/^RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=$MERIDA_KEYSTORE_PASSWORD/" gradle.properties
          echo "Signing with own key"

      # The build number is shown under MeridaGram's name in MeridaGram Settings
      - name: Write build number
        run: sed -i 's/NUMBER = "dev"/NUMBER = "${{ github.run_number }}"/' TMessagesProj/src/main/java/org/telegram/messenger/merida/MeridaBuild.java

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      # Releases do not count toward the Actions storage quota, so this is the main download place
      - name: Publish release
        # a refused release must not lose the APK: the artifact below is still uploaded
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "MeridaGram ${{ github.run_number }}" --notes "$NOTES"

      # Spare copy in the Actions tab: kept 3 days and skipped when storage is full
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MeridaGram-${{ github.run_number }}
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk
          if-no-files-found: error
          retention-days: 3
